<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotina Proteica</title>
  <script>
    (function () {
      fetch('/index.html')
        .then(function (response) { return response.text(); })
        .then(function (html) {
          document.open();
          document.write(html.replace('<head>', '<head><base href="/">'));
          document.close();
        });
    })();
  </script>
</head>
<body></body>
</html>
